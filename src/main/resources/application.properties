spring.application.name=eventlab

# HTTP
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://admin:admin@localhost:27017/eventlab?authSource=admin

# Kafka
spring.kafka.bootstrap-servers=localhost:19092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=eventlab
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.project.eventlab

# Listener
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.ack-mode=record

# Topics
app.kafka.topics.order-created=order.created
app.kafka.topics.payment-processed=payment.processed
app.kafka.topics.notification-created=notification.created
